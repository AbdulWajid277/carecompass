version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --prefix backend
      - npm install --prefix frontend
      - npm run build --prefix frontend
run:
  runtime-version: 22
  command: npm start --prefix backend
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "8080"
    - name: CLIENT_ORIGIN
      value: "*"
    - name: DATA_DIR
      value: "/tmp/carecompass-data"
